
{% extends "base.html" %}

{% block content %}

<div class="welcome-section">

    <div>
        <h1>Edit Student Information</h1>
        <p>Modify the existing student details.</p>
    </div>

    <a href="{{ url_for('students') }}" class="secondary-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Students
    </a>

</div>


<div class="content-card">

    <div class="card-header">

        <div>
            <h2>
                <i class="fa-solid fa-user-pen"></i>
                Update Student Details
            </h2>

            <p>Change the information and save your updates.</p>
        </div>

    </div>


    <form
        action="{{ url_for('update_student', student_id=student.id) }}"
        method="POST"
        class="student-form"
    >

        <div class="form-group">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Course</label>

            <input
                type="text"
                name="course"
                value="{{ student.course }}"
                required
            >

        </div>


        <button type="submit" class="primary-btn">

            <i class="fa-solid fa-floppy-disk"></i>
            Save Changes

        </button>

    </form>

</div>

{% endblock %}
